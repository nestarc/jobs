name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      modern_outbox_package:
        description: Exact @nestarc/outbox npm spec or tarball URL; blank auto-detects 0.2.1
        required: false
        type: string
        default: ''
      modern_outbox_version:
        description: Expected exact version for the separate candidate lane
        required: false
        type: string
        default: ''
      modern_outbox_integrity:
        description: Expected SHA-512 SRI for the separate candidate lane
        required: false
        type: string
        default: ''

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      modern_outbox_package: ${{ inputs.modern_outbox_package || '@nestarc/outbox@0.3.0' }}
      modern_outbox_version: ${{ inputs.modern_outbox_version || (inputs.modern_outbox_package == '' && '0.3.0') || '' }}
      modern_outbox_integrity: ${{ inputs.modern_outbox_integrity || (inputs.modern_outbox_package == '' && 'sha512-rbPiDgQCNVtQifVf01we+vREYDDwccpezc5cSlaoa8VeIW3NxmGWrMe8ccwQRex/pF2MxlFW4K645SDbN27evQ==') || '' }}

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify repository release protection with read-only permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-repository-policy.js

name: Verify

on:
  workflow_call:
    inputs:
      modern_outbox_package:
        description: Exact @nestarc/outbox npm spec or tarball URL for the modern consumer gate
        required: false
        type: string
        default: ''
      modern_outbox_version:
        required: false
        type: string
        default: ''
      modern_outbox_integrity:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  modern-outbox-availability:
    name: Modern Outbox 0.2.1 availability
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Detect the exact published prerequisite
        id: registry
        run: |
          ERROR_FILE="${RUNNER_TEMP}/outbox-registry-error.log"
          set +e
          OUTPUT="$(npm view @nestarc/outbox@0.2.1 version 2>"${ERROR_FILE}")"
          STATUS="$?"
          set -e
          if [ "${STATUS}" -eq 0 ] && [ "${OUTPUT}" = "0.2.1" ]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          elif [ "${STATUS}" -ne 0 ] && grep -q 'E404' "${ERROR_FILE}"; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::@nestarc/outbox@0.2.1 is not published; modern consumer gate is waiting for the external prerequisite"
          else
            cat "${ERROR_FILE}" >&2
            printf '%s\n' "${OUTPUT}" >&2
            if [ "${STATUS}" -eq 0 ]; then
              echo "Unexpected registry version for @nestarc/outbox@0.2.1" >&2
              exit 1
            fi
            exit "${STATUS}"
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:policy
      - run: npm run lint
      - run: npm run build

  unit:
    name: Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand

  module-lifecycle:
    name: Module lifecycle (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: [10, 11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select Nest 11
        if: matrix.nest == 11
        run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm test -- --runInBand test/integration/jobs.module.in-memory.test.ts

  redis-integration:
    name: Redis (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [10, 11]
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select Nest 11
        if: matrix.nest == 11
        run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm run build
      - run: npm run test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379

  consumer-compat:
    name: Consumer (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: ['10.4.22', '11.2.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - run: node scripts/test-core-consumer.js
        env:
          JOBS_TARBALL_DIR: package-artifact
          CORE_NEST_VERSION: ${{ matrix.nest }}

  modern-outbox-consumer:
    name: Modern Outbox consumer (Nest 11.2.1, Prisma 7.10.0)
    needs: [modern-outbox-availability, package-smoke]
    if: >-
      inputs.modern_outbox_package == '@nestarc/outbox@0.2.1' ||
      needs.modern-outbox-availability.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - run: npm run test:consumer:modern
        env:
          OUTBOX_PACKAGE: '@nestarc/outbox@0.2.1'
          JOBS_TARBALL_DIR: package-artifact

  coverage:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm run build
      - run: npm run test:coverage
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - run: node scripts/coverage-evidence.js
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: mkdir package-artifact
      - run: npm pack --pack-destination package-artifact
      - run: tar -tf package-artifact/nestarc-jobs-*.tgz
      - name: Validate packed artifact
        working-directory: ${{ runner.temp }}
        run: |
          mkdir jobs-package-smoke
          cd jobs-package-smoke
          npm init -y
          npm install \
            --strict-peer-deps \
            --legacy-peer-deps=false \
            --force=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            "${GITHUB_WORKSPACE}"/package-artifact/nestarc-jobs-*.tgz \
            @nestjs/common@11.2.1 \
            @nestjs/core@11.2.1 \
            reflect-metadata@0.2.2 \
            rxjs@7.8.2
          npm ls @nestarc/jobs @nestjs/common @nestjs/core reflect-metadata rxjs --all
          if npm ls @nestarc/outbox >/dev/null 2>&1; then
            echo "The optional Outbox peer must not be installed by the Jobs artifact"
            exit 1
          fi
          if npm ls bullmq >/dev/null 2>&1; then
            echo "The optional BullMQ peer must not be installed by the Jobs artifact"
            exit 1
          fi
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          require('reflect-metadata');
          const manifestPath = require.resolve('@nestarc/jobs/package.json');
          const packageDir = path.dirname(manifestPath);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const sourceManifest = JSON.parse(
            fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'package.json'), 'utf8'),
          );

          assert.equal(manifest.name, '@nestarc/jobs');
          assert.equal(manifest.version, sourceManifest.version);
          assert.equal(manifest.main, 'dist/index.js');
          assert.equal(manifest.types, 'dist/index.d.ts');
          assert.equal(manifest.peerDependencies?.['@nestarc/outbox'], '^0.2.1 || ^0.3.0');
          assert.equal(manifest.peerDependencies?.['@nestjs/common'], '^10.0.0 || ^11.0.0');
          assert.equal(manifest.peerDependencies?.['@nestjs/core'], '^10.0.0 || ^11.0.0');
          assert.equal(manifest.peerDependencies?.bullmq, '^5.76.2');
          assert.equal(manifest.peerDependenciesMeta?.['@nestarc/outbox']?.optional, true);
          assert.equal(manifest.peerDependenciesMeta?.bullmq?.optional, true);

          for (const relativePath of [
            'dist/index.js',
            'dist/index.d.ts',
            'README.md',
            'CHANGELOG.md',
            'SECURITY.md',
            'LICENSE',
            'docs/prd.md',
            'docs/spec.md',
            'docs/spec-v0.2.md',
            'docs/spec-v0.3.md',
          ]) {
            assert.equal(fs.existsSync(path.join(packageDir, relativePath)), true, relativePath);
          }

          const api = require('@nestarc/jobs');
          assert.equal(typeof api.JobsModule?.forInMemory, 'function');
          assert.equal(typeof api.FakeJobsService, 'function');
          assert.equal(typeof api.createOutboxJobsPublisher, 'function');
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: package-artifact/*.tgz
          if-no-files-found: error

  bullmq-v5:
    name: BullMQ v5 (${{ matrix.bullmq }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bullmq: ['5.76.2', '5.81.4']
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 1s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false bullmq@${{ matrix.bullmq }}
      - run: npm run build
      - run: npm run test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379

  outbox-candidate:
    name: Exact Outbox candidate
    needs: package-smoke
    if: >-
      inputs.modern_outbox_version != '' ||
      (inputs.modern_outbox_package != '' && inputs.modern_outbox_package != '@nestarc/outbox@0.2.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - name: Validate manifest and test exact producer contract
        env:
          CANDIDATE_PACKAGE: ${{ inputs.modern_outbox_package }}
          CANDIDATE_VERSION: ${{ inputs.modern_outbox_version }}
          CANDIDATE_INTEGRITY: ${{ inputs.modern_outbox_integrity }}
          JOBS_TARBALL_DIR: package-artifact
        run: |
          node -e "require('fs').writeFileSync('outbox-candidate.json', JSON.stringify({package:process.env.CANDIDATE_PACKAGE,version:process.env.CANDIDATE_VERSION,integrity:process.env.CANDIDATE_INTEGRITY}))"
          node scripts/test-outbox-candidate-consumer.js outbox-candidate.json

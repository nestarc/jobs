name: Verify

on:
  workflow_call:
    inputs:
      modern_outbox_package:
        description: Exact @nestarc/outbox npm spec or tarball URL for the modern consumer gate
        required: false
        type: string
        default: ''

jobs:
  modern-outbox-availability:
    name: Modern Outbox 0.2.1 availability
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Detect the exact published prerequisite
        id: registry
        run: |
          set +e
          OUTPUT="$(npm view @nestarc/outbox@0.2.1 version 2>&1)"
          STATUS="$?"
          set -e
          if [ "${STATUS}" -eq 0 ] && [ "${OUTPUT}" = "0.2.1" ]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          elif printf '%s' "${OUTPUT}" | grep -q 'E404'; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::@nestarc/outbox@0.2.1 is not published; modern consumer gate is waiting for the external prerequisite"
          else
            printf '%s\n' "${OUTPUT}" >&2
            if [ "${STATUS}" -eq 0 ]; then
              echo "Unexpected registry version for @nestarc/outbox@0.2.1" >&2
              exit 1
            fi
            exit "${STATUS}"
          fi

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  unit:
    name: Unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand

  module-lifecycle:
    name: Module lifecycle (Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: [10, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select Nest 11
        if: matrix.nest == 11
        run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm test -- --runInBand test/integration/jobs.module.in-memory.test.ts

  redis-integration:
    name: Redis (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        nest: [10, 11]
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Select Nest 11
        if: matrix.nest == 11
        run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm run test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379

  consumer-compat:
    name: Consumer (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        nest: [10, 11]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm pack --pack-destination "${RUNNER_TEMP}"
      - name: Install packed library without BullMQ
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install --package-lock=false \
            "${RUNNER_TEMP}"/nestarc-jobs-*.tgz \
            "@nestjs/common@^${{ matrix.nest }}.0.0" \
            "@nestjs/core@^${{ matrix.nest }}.0.0" \
            "@nestjs/testing@^${{ matrix.nest }}.0.0" \
            reflect-metadata@^0.2.0 rxjs@^7.0.0 typescript@^5.4.0 @types/node@^20.0.0
          npm ls --omit=dev
          if npm ls bullmq >/dev/null 2>&1; then
            echo "BullMQ must remain optional for core consumers"
            exit 1
          fi
          node -e "require('reflect-metadata'); const {Test}=require('@nestjs/testing'); const {JobsModule,JobsService,HandlerRegistry}=require('@nestarc/jobs'); (async()=>{const app=await Test.createTestingModule({imports:[JobsModule.forInMemory({jobTypes:['smoke']})]}).compile(); app.get(HandlerRegistry).register('smoke',async()=>null); await app.init(); await app.get(JobsService).enqueue('smoke',{}); await app.close()})().catch(error=>{console.error(error);process.exit(1)})"
          node -e "require('fs').writeFileSync('index.ts', \"import { defineJobs, job, TypedJobsService } from '@nestarc/jobs'; const defs = defineJobs({ smoke: job<{ value: string }>().defaults({ attempts: 2 }) }); declare const jobs: TypedJobsService<typeof defs>; void jobs.enqueue('smoke', { value: 'ok' });\")"
          npx tsc --strict --skipLibCheck false --noEmit --target ES2022 --module commonjs --moduleResolution node index.ts

  modern-outbox-consumer:
    name: Modern Outbox consumer (Nest 11.2.1, Prisma 7.10.0)
    needs: modern-outbox-availability
    if: >-
      inputs.modern_outbox_package != '' ||
      needs.modern-outbox-availability.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:consumer:modern
        env:
          OUTBOX_PACKAGE: ${{ inputs.modern_outbox_package || '@nestarc/outbox@0.2.1' }}

  coverage:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@^11.0.0 @nestjs/core@^11.0.0 @nestjs/testing@^11.0.0
      - run: npm run test:coverage
        env:
          REDIS_URL: redis://127.0.0.1:6379
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: mkdir package-artifact
      - run: npm pack --pack-destination package-artifact
      - run: tar -tf package-artifact/nestarc-jobs-*.tgz
      - name: Validate packed artifact
        working-directory: ${{ runner.temp }}
        run: |
          mkdir jobs-package-smoke
          cd jobs-package-smoke
          npm init -y
          npm install \
            --strict-peer-deps \
            --legacy-peer-deps=false \
            --force=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            "${GITHUB_WORKSPACE}"/package-artifact/nestarc-jobs-*.tgz \
            @nestjs/common@11.2.1 \
            @nestjs/core@11.2.1 \
            reflect-metadata@0.2.2 \
            rxjs@7.8.2
          npm ls @nestarc/jobs @nestjs/common @nestjs/core reflect-metadata rxjs --all
          if npm ls @nestarc/outbox >/dev/null 2>&1; then
            echo "The optional Outbox peer must not be installed by the Jobs artifact"
            exit 1
          fi
          if npm ls bullmq >/dev/null 2>&1; then
            echo "The optional BullMQ peer must not be installed by the Jobs artifact"
            exit 1
          fi
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          require('reflect-metadata');
          const manifestPath = require.resolve('@nestarc/jobs/package.json');
          const packageDir = path.dirname(manifestPath);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const sourceManifest = JSON.parse(
            fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'package.json'), 'utf8'),
          );

          assert.equal(manifest.name, '@nestarc/jobs');
          assert.equal(manifest.version, sourceManifest.version);
          assert.equal(manifest.main, 'dist/index.js');
          assert.equal(manifest.types, 'dist/index.d.ts');
          assert.equal(manifest.peerDependencies?.['@nestarc/outbox'], '^0.2.0');
          assert.equal(manifest.peerDependencies?.['@nestjs/common'], '^10.0.0 || ^11.0.0');
          assert.equal(manifest.peerDependencies?.['@nestjs/core'], '^10.0.0 || ^11.0.0');
          assert.equal(manifest.peerDependencies?.bullmq, '^5.74.1');
          assert.equal(manifest.peerDependenciesMeta?.['@nestarc/outbox']?.optional, true);
          assert.equal(manifest.peerDependenciesMeta?.bullmq?.optional, true);

          for (const relativePath of [
            'dist/index.js',
            'dist/index.d.ts',
            'README.md',
            'CHANGELOG.md',
            'LICENSE',
            'docs/prd.md',
            'docs/spec.md',
            'docs/spec-v0.2.md',
            'docs/spec-v0.3.md',
          ]) {
            assert.equal(fs.existsSync(path.join(packageDir, relativePath)), true, relativePath);
          }

          const api = require('@nestarc/jobs');
          assert.equal(typeof api.JobsModule?.forInMemory, 'function');
          assert.equal(typeof api.FakeJobsService, 'function');
          assert.equal(typeof api.createOutboxJobsPublisher, 'function');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: package-artifact/*.tgz
          if-no-files-found: error

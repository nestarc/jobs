name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      modern_outbox_package: '@nestarc/outbox@0.3.0'
      modern_outbox_version: '0.3.0'
      modern_outbox_integrity: 'sha512-rbPiDgQCNVtQifVf01we+vREYDDwccpezc5cSlaoa8VeIW3NxmGWrMe8ccwQRex/pF2MxlFW4K645SDbN27evQ=='

  artifact-policy:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify repository release protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-repository-policy.js
      - name: Verify immutable tag and main ancestry
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          test "${TAG_COMMIT}" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${TAG_COMMIT}" origin/main
          REMOTE_TAG="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | tail -1 | cut -f1)"
          test "${REMOTE_TAG}" = "${TAG_COMMIT}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - name: Validate exact artifact and registry identity
        id: registry
        run: node scripts/verify-release-artifact.js package-artifact

  publish:
    needs: artifact-policy
    if: needs.artifact-policy.outputs.published != 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - name: Publish the verified tarball
        run: npm publish ./package-artifact/nestarc-jobs-*.tgz --ignore-scripts --provenance --access public

  release:
    needs: [artifact-policy, publish]
    if: >-
      always() && needs.artifact-policy.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: package-artifact
      - name: Verify published bytes and provenance signatures
        run: |
          node scripts/verify-release-artifact.js package-artifact --require-published
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          mkdir "${RUNNER_TEMP}/published-signatures"
          cd "${RUNNER_TEMP}/published-signatures"
          npm init -y
          npm install --ignore-scripts --strict-peer-deps --legacy-peer-deps=false --force=false --save-exact \
            "@nestarc/jobs@${PACKAGE_VERSION}" @nestjs/common@11.2.1 @nestjs/core@11.2.1 reflect-metadata@0.2.2 rxjs@7.8.2
          npm audit signatures
      - name: Create GitHub Release after publication verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}"; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          fi
